services:
  app:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    stdin_open: true
    tty: true

  mongo-test:
    image: mongo:7
    profiles: ["test"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 3s
      timeout: 5s
      retries: 20

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      TEST_MONGO_URI: mongodb://mongo-test:27017
    depends_on:
      mongo-test:
        condition: service_healthy